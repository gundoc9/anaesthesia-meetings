# Regenerates the calendar files and the offline cache stamp whenever the page changes.
# Upload a new index.html and this workflow writes ics/*.ics, the two subscription files and sw.js.
name: Calendar files
on:
  push:
    branches: [main]
    paths: ['index.html', 'tools/make_ics.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/make_ics.py --from-html index.html --docs .
      - name: Commit the calendar files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ics anaesthesia-meetings.ics anaesthesia-meetings-deadlines.ics sw.js
          git diff --cached --quiet || git commit -m "Calendar files and offline cache stamp"
          git push
